name: Publish xGet 2.16.0

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'Release xGet 2.16.0')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate code and installer
        run: |
          python3 -m py_compile xget.py tests/test_xget.py tests/test_ubuntu_update.py tests/test_torrent_upgrade.py tests/test_http_torrent_216.py
          python3 -m unittest discover -s tests -v
          bash -n install_ubuntu.sh uninstall_ubuntu.sh
      - name: Package Windows and Ubuntu source release
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          files = [
              ".gitignore", "INSTALL-xGet.bat", "RUN-xGet.bat",
              "install_ubuntu.sh", "install_windows.ps1",
              "uninstall_ubuntu.sh", "uninstall_windows.ps1",
              "xget.py", "README.md", "xGet-DEVELOPMENT-HANDOFF.md",
              "urls.example.txt", "tests/test_xget.py",
              "tests/test_ubuntu_update.py", "tests/test_torrent_upgrade.py",
              "tests/test_http_torrent_216.py",
          ]
          with ZipFile("xGet-2.16.0-English.zip", "w", ZIP_DEFLATED, compresslevel=9) as archive:
              for name in files:
                  item = Path(name)
                  if not item.is_file():
                      raise FileNotFoundError(item)
                  archive.write(item, arcname=name)
          with ZipFile("xGet-2.16.0-English.zip") as archive:
              if archive.testzip() is not None:
                  raise ValueError("ZIP integrity verification failed")
          PY
          sha256sum xGet-2.16.0-English.zip > xGet-2.16.0-English.zip.sha256
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.16.0 xGet-2.16.0-English.zip xGet-2.16.0-English.zip.sha256 \
            --target "$GITHUB_SHA" \
            --title "xGet 2.16.0" \
            --notes "Improves HTTP retries, partial download resume and software installer detection. Adds Torrent v1/v2/hybrid inspection and optional qBittorrent v2 handoff. Preserves multi-URL and playlist YouTube downloading, Torrent controls and Windows/Ubuntu installers. All 67 automated tests pass."
