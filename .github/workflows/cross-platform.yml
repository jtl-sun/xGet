name: Cross-platform checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile application
        run: python -m py_compile xget.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Check Ubuntu scripts
        if: runner.os == 'Linux'
        run: bash -n install_ubuntu.sh uninstall_ubuntu.sh

      - name: Check Windows scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          foreach ($script in @('install_windows.ps1', 'uninstall_windows.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $script),
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            $errors += $parseErrors
          }
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
